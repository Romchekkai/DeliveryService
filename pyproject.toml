[project]
name = "deliveryservice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "romchek-kai", email = "kaidenkoroman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "hvac>=2.4.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=5.2.0",
    "requests>=2.34.2",
    "sentry-sdk>=2.20.0",
    "sqlalchemy>=2.0.54",
    "structlog>=26.1.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
deliveryservice = "deliveryservice:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "shared"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.7",
    "types-passlib>=1.7.7.20260211",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
exclude = ["(^|/)tests/", "(^|/)migrations/"]
mypy_path = "services/users/src:services/users:services/delivery/src:services/delivery:services/support/src:services/support"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

#[[tool.mypy.overrides]]
#module = "jose.*"
#ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "hvac.*"
ignore_missing_imports = true
