worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # ---- upstreams ----
    upstream users_upstream {
        server users:8000;
    }

    upstream delivery_upstream {
        server delivery:8000;
    }

    upstream support_upstream {
        server support:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # ---- health via gateway ----
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx"}';
        }

        location = /health/users {
            proxy_pass http://users_upstream/health;
        }
        location = /health/delivery {
            proxy_pass http://delivery_upstream/health;
        }
        location = /health/support {
            proxy_pass http://support_upstream/health;
        }

        # ---- Swagger (удобно для dev) ----
        location /docs/users {
            proxy_pass http://users_upstream/docs;
            proxy_set_header Host $host;
        }
        location /docs/delivery {
            proxy_pass http://delivery_upstream/docs;
            proxy_set_header Host $host;
        }
        location /docs/support {
            proxy_pass http://support_upstream/docs;
            proxy_set_header Host $host;
        }

        location = /openapi/users.json {
            proxy_pass http://users_upstream;
        }
        location = /openapi/delivery.json {
            proxy_pass http://delivery_upstream;
        }
        location = /openapi/support.json {
            proxy_pass http://support_upstream;
        }

        # ---- users: auth + keys ----
        location /api/v1/auth {
            proxy_pass http://users_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/keys {
            proxy_pass http://users_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- delivery: parcels + admin ----
        location /api/v1/parcels {
            proxy_pass http://delivery_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/v1/admin {
            proxy_pass http://delivery_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # ---- support: RAG ----
        location /api/v1/support {
            proxy_pass http://support_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # LLM может отвечать долго
            proxy_read_timeout 120s;
        }

        # ---- metrics (опционально, для Prometheus) ----
        location /metrics/users {
            proxy_pass http://users_upstream/metrics;
        }
        location /metrics/delivery {
            proxy_pass http://delivery_upstream/metrics;
        }
        location /metrics/support {
            proxy_pass http://support_upstream/metrics;
        }

        location / {
            default_type text/plain;
            return 200 'DeliveryService gateway\n\nEndpoints:\n  GET  /health\n  GET  /health/users|delivery|support\n  GET  /docs/users|delivery|support\n  POST /api/v1/auth/...\n  GET  /api/v1/keys/public\n  *    /api/v1/parcels/...\n  *    /api/v1/admin/...\n  POST /api/v1/support/ask\n';
        }
    }
}
