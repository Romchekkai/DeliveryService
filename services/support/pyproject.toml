[project]
name = "support"
version = "0.1.0"
description = "RAG support service for delivery rules"
readme = "README.md"
authors = [
    { name = "romchek-kai", email = "kaidenkoroman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.2.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=3.3.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",]
