[project]
name = "delivery_service"
version = "0.1.0"
description = "Parcel registration and delivery cost calculation service"
readme = "README.md"
authors = [
    { name = "romchek-kai", email = "kaidenkoroman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pyjwt[crypto]>=2.14.0",
    "pydantic-settings>=2.15.0",
    "redis>=5.2.0",
    "sentry-sdk[fastapi]>=2.20.0",
    "sqlalchemy>=2.0.54",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["src"]
branch = true
# SQLAlchemy's async layer runs on greenlets; without this the code after every DB `await`
# is reported as not executed.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
