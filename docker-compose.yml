  #   ports:
  #     - "5434:5432"
  #   volumes:
  #     - pg_parcels_data:/var/lib/postgresql/data
  #   networks:
  #     - backend
  #
  # parcels:
  #   build: ./services/parcels
  #   ports: ["8001:8000"]
  #   environment:
  #     DB_HOST: postgres-parcels
  #     DB_PORT: 5432
  #     DB_USER: postgres
  #     DB_PASSWORD: dev_local_pass_123
  #     DB_NAME: parcels_db
  #     USERS_PUBLIC_KEY_URL: http://users:8000/api/v1/keys/public
  #   depends_on:
  #     - postgres-parcels
  #     - users
  #   networks:
  #     - backend

networks:
  backend:
    driver: bridge

volumes:
  pg_users_data:
  # pg_parcels_data:
